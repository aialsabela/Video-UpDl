name: Download Telegram & Upload to GitHub Release

on:
  schedule:
    - cron: '0 */6 * * *'  # هر ۶ ساعت
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install telethon -q
          echo "✅ Dependencies installed"

      - name: Download from Telegram
        id: download
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          echo "⏳ Starting Telegram download..."
          python scripts/download_telegram.py
          if [ $? -eq 0 ]; then
            echo "download_success=true" >> $GITHUB_OUTPUT
            echo "✅ Download completed successfully"
          else
            echo "download_success=false" >> $GITHUB_OUTPUT
            echo "❌ Download failed"
            exit 1
          fi

      - name: Verify downloaded file
        if: steps.download.outputs.download_success == 'true'
        run: |
          echo "📂 Checking file_info.json..."
          if [ -f "file_info.json" ]; then
            echo "✅ file_info.json found"
            cat file_info.json
          else
            echo "❌ file_info.json not found"
            ls -la
            exit 1
          fi

      - name: Split and Upload
        if: steps.download.outputs.download_success == 'true'
        id: split
        run: |
          echo "⏳ Starting file split..."
          python scripts/split_and_upload.py
          if [ $? -eq 0 ]; then
            echo "split_success=true" >> $GITHUB_OUTPUT
            echo "✅ Split completed successfully"
          else
            echo "split_success=false" >> $GITHUB_OUTPUT
            echo "❌ Split failed"
            exit 1
          fi

      - name: Verify release files
        if: steps.split.outputs.split_success == 'true'
        run: |
          echo "📂 Checking release_files.json..."
          if [ -f "release_files.json" ]; then
            echo "✅ release_files.json found"
            cat release_files.json
          else
            echo "❌ release_files.json not found"
            ls -la
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.split.outputs.split_success == 'true'
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⏳ Starting GitHub release creation..."
          python scripts/create_release.py
          if [ $? -eq 0 ]; then
            echo "release_success=true" >> $GITHUB_OUTPUT
            echo "✅ Release created successfully"
          else
            echo "release_success=false" >> $GITHUB_OUTPUT
            echo "❌ Release creation failed"
            exit 1
          fi

      - name: Success Summary
        if: steps.release.outputs.release_success == 'true'
        run: |
          echo "✅ Pipeline completed successfully!"
          echo "📊 Summary:"
          echo "   - Downloaded from Telegram"
          echo "   - Split files (if needed)"
          echo "   - Created GitHub Release"

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up temporary files..."
          rm -rf telegram_files sessions uploaded_files 2>/dev/null || true
          rm -f telegram_session.session 2>/dev/null || true
          echo "✅ Cleanup completed"

      - name: Error Summary
        if: failure()
        run: |
          echo "❌ Pipeline failed!"
          echo "📂 Working directory contents:"
          ls -la
          echo ""
          echo "📝 Checking for error logs..."
          [ -f "file_info.json" ] && echo "file_info.json exists" || echo "file_info.json missing"
          [ -f "release_files.json" ] && echo "release_files.json exists" || echo "release_files.json missing"
